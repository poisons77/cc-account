<svg xmlns="http://www.w3.org/2000/svg" width="636" height="190" viewBox="0 0 636 190" role="img" aria-label="cc-account list">
  <rect width="636" height="190" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h616a10 10 0 0 1 10 10v22H0z" fill="#161b22"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="318.0" y="21" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8b949e">cc-account list</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="18" y="52" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">cc-account list</tspan></text>
    <text x="18" y="74" xml:space="preserve"><tspan fill="#d2a8ff">* </tspan><tspan fill="#e6edf3">personal  me@example.com  [max]  </tspan><tspan fill="#e3b341">login expires in 2d</tspan></text>
    <text x="18" y="96" xml:space="preserve"><tspan fill="#8b949e">  work      me@company.com  [max]  login expires in 18d</tspan></text>
    <text x="18" y="118" xml:space="preserve"><tspan fill="#e3b341">! 'personal' login expires in 2d. Renew it now? A browser window opens.</tspan></text>
    <text x="18" y="140" xml:space="preserve"><tspan fill="#8b949e">  1: Renew    2: Not now    0: Leave the rest</tspan></text>
    <text x="18" y="162" xml:space="preserve"><tspan fill="#8b949e">  &gt; </tspan><tspan fill="#e6edf3">1</tspan></text>
  </g>
</svg>
