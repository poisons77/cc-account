<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="How cc-account renew isolates a login: the sign-in runs in a throwaway config directory, and its result is kept only when the email matches the snapshot">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
    <style>
      .box { fill: #161b22; stroke: #30363d; rx: 8; }
      .live { stroke: #56d364; }
      .scratch { stroke: #d2a8ff; stroke-dasharray: 4 3; }
      .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e6edf3; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 11.5px; fill: #7d8590; }
      .edge { stroke: #7d8590; fill: none; marker-end: url(#arrow); }
      .check { font-size: 11.5px; fill: #e3b341; }
    </style>
  </defs>

  <rect width="760" height="330" fill="#0d1117"/>

  <text class="t label" x="24" y="28">cc-account renew personal</text>

  <rect class="box scratch" x="24" y="52" width="250" height="96"/>
  <text class="t label" x="40" y="78">Throwaway config directory</text>
  <text class="t small" x="40" y="99">claude auth login --email personal@…</text>
  <text class="t small" x="40" y="117">CLAUDE_CONFIG_DIR points here</text>
  <text class="t small" x="40" y="135">removed when renew ends</text>

  <rect class="box" x="330" y="52" width="230" height="96"/>
  <text class="t label" x="346" y="78">Private browser window</text>
  <text class="t small" x="346" y="99">no claude.ai session of its own</text>
  <text class="t small" x="346" y="117">email prefilled as login_hint</text>
  <text class="t small" x="346" y="135">you sign in</text>

  <path class="edge" d="M 274 100 L 326 100"/>
  <text class="t small" x="300" y="88" text-anchor="middle">BROWSER</text>

  <path class="edge" d="M 445 152 L 445 186"/>

  <rect class="box" x="255" y="190" width="380" height="54"/>
  <text class="t label" x="271" y="213">Does the new login match meta.json?</text>
  <text class="t check" x="271" y="233">claude auth status --json, read in the throwaway directory</text>

  <path class="edge" d="M 255 217 L 150 217 L 150 252"/>
  <text class="t small" x="160" y="238">no</text>
  <text class="t small" x="24" y="272">Discarded. The snapshot is untouched,</text>
  <text class="t small" x="24" y="290">and renew names the account that signed in.</text>

  <path class="edge" d="M 635 217 L 700 217 L 700 252"/>
  <text class="t small" x="646" y="238">yes</text>

  <rect class="box live" x="400" y="252" width="336" height="60"/>
  <text class="t label" x="416" y="275">Snapshot replaced</text>
  <text class="t small" x="416" y="296">live tokens too, when this is the live account</text>
</svg>
